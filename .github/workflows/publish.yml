name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # ✅ 新增：允许手动触发
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # ✅ 必须添加：允许请求 OIDC 令牌
      contents: read   # ✅ 推荐添加：允许读取仓库内容
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack --configuration Release --output nupkg -p:Version=${{ env.VERSION }}
        
      - name: List generated packages
        run: ls -la nupkg/
        
      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
