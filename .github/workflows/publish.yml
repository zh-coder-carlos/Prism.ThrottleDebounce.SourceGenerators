name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # ✅ 新增：允许手动触发
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 用于可信发布
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 关键步骤：显式安装 .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # netstandard2.0 兼容 .NET Core 2.1+ 或 .NET 5+
          # 建议使用较新的 LTS 版本以获得更好的性能和兼容性
          dotnet-version: '8.0.x' 

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --output nupkg
        # 注意：不要在这里硬编码版本号，除非你明确知道自己在做什么
        # 让 .csproj 中的 <Version> 或 Git Tag 来控制版本
        
      - name: Push to NuGet.org
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json
