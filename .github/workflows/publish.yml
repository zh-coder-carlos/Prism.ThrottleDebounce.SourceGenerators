name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --output nupkg --no-build

      # ✅ 安装 nuget.exe（支持 OIDC）
      - name: Install NuGet.exe
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      # ✅ 使用 nuget.exe 推送（自动触发 OIDC）
      - name: Push to NuGet.org
        run: nuget push nupkg/*.nupkg -SkipDuplicate -Source https://api.nuget.org/v3/index.json